{% extends "portal/base.html" %}

{% block title %}{{ title }} · Ventas ADC{% endblock %}

{% block content %}
<a class="back-link" href="{% url 'order_list' %}">
    <i data-lucide="arrow-left" class="icon" aria-hidden="true"></i>
    <span>Volver a órdenes</span>
</a>

<section class="page-heading">
    <div>
        <p class="eyebrow">Ventas / Órdenes</p>
        <h1>{{ title }}</h1>
        <p class="page-subtitle">Completa la información para guardar los cambios.</p>
    </div>
</section>

<section class="panel form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button button-primary" type="submit">
                <i data-lucide="save" class="icon" aria-hidden="true"></i>
                <span>Guardar orden</span>
            </button>
            <a class="button button-secondary" href="{% url 'order_list' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
