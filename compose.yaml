services:
  
  
  # SERVICIO DE  BASE DE DATOS SQL SERVER 2022
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - ventasadc_sqlserver2022_data:/var/opt/mssql
    networks:
      - ventasadc_net
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -No -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s


   #SERVICIO DE API REST

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}"
      MSSQL_APP_PASSWORD: "${MSSQL_APP_PASSWORD:?Define MSSQL_APP_PASSWORD en .env}"
      DB_HOST: db
      DB_PORT: "1433"
      INIT_SQL_PATH: /app/db/init.sql
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ventasadc_net
    expose:
      - "5000"
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


#SERVICIO WEB DE FRONTEND
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}"
      API_BASE_URL: "http://api:5000"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8090:8000"
    networks:
      - ventasadc_net
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256







networks:
  ventasadc_net:
    name: ventasadc_net
    driver: bridge

volumes:
  ventasadc_sqlserver2022_data:
    name: ventasadc_sqlserver2022_data